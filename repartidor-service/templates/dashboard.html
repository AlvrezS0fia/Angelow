<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANGELOW | Dashboard Repartidor</title>
  <link rel="shortcut icon" href="/static/uploads/documentos/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <!-- HEADER -->
  <header class="dash-header">
    <div class="dash-header-inner">
      <div class="dash-logo">
        <img src="/static/uploads/documentos/logo.png" alt="ANGELOW">
        <div class="dash-logo-text">
          <h1>ANGELOW</h1>
          <p>Panel de Repartidor</p>
        </div>
      </div>
      <div class="dash-user">
        <div class="dash-avatar" id="userAvatar">R</div>
        <div class="dash-user-info">
          <h3 id="userName">Repartidor</h3>
          <p id="userVehicle">Cargando...</p>
        </div>
      </div>
      <div class="dash-actions">
        <button class="dash-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
      </div>
    </div>
  </header>

  <div class="dash-container">
    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-dollar-sign"></i></div>
        <div class="stat-value" id="statGanancias">$0</div>
        <div class="stat-label">Ganancias hoy</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-box"></i></div>
        <div class="stat-value" id="statPedidos">0</div>
        <div class="stat-label">Pedidos hoy</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon yellow"><i class="fas fa-truck"></i></div>
        <div class="stat-value" id="statTransito">0</div>
        <div class="stat-label">En tránsito</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple"><i class="fas fa-star"></i></div>
        <div class="stat-value" id="statEntregas">0</div>
        <div class="stat-label">Total entregas</div>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="pedidos" onclick="switchTab('pedidos')">
        <i class="fas fa-list"></i> Todos los Pedidos <span class="tab-badge" id="badgeAll">0</span>
      </button>
      <button class="tab-btn" data-tab="rastreo" onclick="switchTab('rastreo')">
        <i class="fas fa-map-marked-alt"></i> Rastreo de Pedidos <span class="tab-badge" id="badgeActivos">0</span>
      </button>
      <button class="tab-btn" data-tab="terminados" onclick="switchTab('terminados')">
        <i class="fas fa-check-double"></i> Pedidos Terminados
      </button>
    </div>

    <!-- TAB: PEDIDOS -->
    <div class="tab-content active" id="tabPedidos">
      <div class="pedidos-grid" id="pedidosGrid"></div>
    </div>

    <!-- TAB: RASTREO -->
    <div class="tab-content" id="tabRastreo">
      <div class="map-section">
        <div class="map-header">
          <div class="map-title"><i class="fas fa-map-marked-alt"></i> Rastreo de Pedidos Activos</div>
        </div>
        <div class="map-list" id="mapList"></div>
        <div class="map-container" id="mapContainer"></div>
      </div>
    </div>

    <!-- TAB: TERMINADOS -->
    <div class="tab-content" id="tabTerminados">
      <div style="background:#fff;border-radius:var(--radius);border:1px solid var(--gray-200);box-shadow:var(--shadow-sm);overflow:hidden;">
        <div style="padding:16px 20px;border-bottom:1px solid var(--gray-200);">
          <div class="map-title"><i class="fas fa-check-double"></i> Pedidos Terminados</div>
        </div>
        <div class="term-table-wrap" id="termTableWrap"></div>
      </div>
    </div>
  </div>

  <!-- MODAL: VER UBICACION -->
  <div class="modal-overlay" id="mapModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-header-title"><i class="fas fa-map-marked-alt"></i> <span id="mapModalTitle">Ubicación en Tiempo Real</span></div>
        <button class="modal-close" onclick="closeMapModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-info" id="mapModalInfo"></div>
        <div class="modal-map" id="mapModalMap"></div>
        <div class="modal-actions" id="mapModalActions"></div>
      </div>
    </div>
  </div>

  <!-- MODAL: OBSERVACION -->
  <div class="modal-overlay" id="obsModal">
    <div class="modal-box obs-modal-box">
      <div class="modal-header">
        <div class="modal-header-title"><i class="fas fa-comment-dots"></i> Observación</div>
        <button class="modal-close" onclick="closeObsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--gray-500);margin-bottom:12px;">Describe el estado de la entrega (opcional):</p>
        <textarea class="obs-textarea" id="obsTextarea" placeholder="Ejemplo: Entregado a la persona correcta en la portería..."></textarea>
        <div class="modal-actions" style="justify-content:flex-end;margin-top:12px;">
          <button class="btn-action btn-rechazar" onclick="closeObsModal()" style="min-width:auto;">Cancelar</button>
          <button class="btn-action btn-aceptar" id="obsConfirmBtn" style="min-width:auto;" onclick="confirmObs()">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: RECHAZO PEDIDO -->
  <div class="modal-overlay" id="rechazoModal">
    <div class="modal-box obs-modal-box">
      <div class="modal-header" style="background:linear-gradient(135deg,var(--danger) 0%,var(--danger-dark) 100%);">
        <div class="modal-header-title"><i class="fas fa-ban"></i> Rechazar Pedido</div>
        <button class="modal-close" onclick="closeRechazoModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--gray-500);margin-bottom:12px;">Motivo del rechazo (opcional):</p>
        <textarea class="obs-textarea" id="rechazoTextarea" placeholder="Ejemplo: Cliente no disponible, dirección incorrecta..."></textarea>
        <div class="modal-actions" style="justify-content:flex-end;margin-top:12px;">
          <button class="btn-action btn-rechazar" onclick="closeRechazoModal()" style="min-width:auto;">Cancelar</button>
          <button class="btn-action" style="min-width:auto;background:var(--danger);color:#fff;" onclick="confirmRechazo()">Rechazar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
